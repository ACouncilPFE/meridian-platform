# Actions are pinned by commit SHA (tags can be force-moved, as happened to
# trivy-action in March 2026). Dependabot keeps those pins current by opening
# a PR per update, which CI then validates like any other change.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directories:
      - /services/intake-api
      - /workflows/pipeline-worker
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: docker
    directories:
      - /services/intake-api
      - /workflows/pipeline-worker
    schedule:
      interval: weekly

  - package-ecosystem: terraform
    directories:
      - /terraform/envs/prod
      - /terraform/envs/demo
    schedule:
      interval: weekly
