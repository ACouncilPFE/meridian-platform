name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      terraform: ${{ steps.f.outputs.terraform }}
      intake: ${{ steps.f.outputs.intake }}
      worker: ${{ steps.f.outputs.worker }}
      obs: ${{ steps.f.outputs.obs }}
    steps:
      - uses: actions/checkout@v4
      - id: f
        uses: dorny/paths-filter@v3
        with:
          filters: |
            terraform: ['terraform/**', 'observability/prometheus/rules/**']
            intake: ['services/intake-api/**']
            worker: ['workflows/pipeline-worker/**']
            obs: ['observability/**']

  intake-api:
    needs: changes
    if: needs.changes.outputs.intake == 'true' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/intake-api
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: app, POSTGRES_PASSWORD: app, POSTGRES_DB: app }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U app" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv venv && uv pip install -e ".[dev]"
      - run: uv run ruff check src tests migrations
      - run: uv run ruff format --check src tests
      - run: uv run mypy src
      - name: Tests (migrations against real Postgres)
        run: uv run pytest -q --junitxml=junit.xml
        env:
          TEST_DATABASE_URL: postgresql+psycopg://app:app@localhost:5432/app

  pipeline-worker:
    needs: changes
    if: needs.changes.outputs.worker == 'true' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workflows/pipeline-worker
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv venv && uv pip install -e ".[dev]"
      - run: uv run ruff check src tests
      - run: uv run pytest -q   # includes Temporal time-skipping workflow tests

  dr-lambda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pytest && cd lambdas/dr_verify && pytest -q

  observability:
    needs: changes
    if: needs.changes.outputs.obs == 'true' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install promtool
        run: |
          curl -sSL https://github.com/prometheus/prometheus/releases/download/v2.54.1/prometheus-2.54.1.linux-amd64.tar.gz | tar xz
          sudo mv prometheus-2.54.1.linux-amd64/promtool /usr/local/bin/
      - run: promtool check rules observability/prometheus/rules/*.yml
      - run: promtool test rules observability/prometheus/tests/*.test.yml
      - name: Dashboards are up to date with their generator
        run: python3 observability/grafana/build_dashboards.py --check

  terraform:
    needs: changes
    if: needs.changes.outputs.terraform == 'true' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: 1.9.8 }
      - run: terraform fmt -check -recursive terraform
      - name: Module wiring (inputs/outputs) check
        run: pip install python-hcl2 && python3 scripts/ci/tf_wiring_check.py
      - name: Validate every module and environment
        run: |
          for d in terraform/modules/* terraform/envs/* terraform/bootstrap/*; do
            echo "::group::$d"
            terraform -chdir="$d" init -backend=false -input=false >/dev/null
            terraform -chdir="$d" validate
            echo "::endgroup::"
          done
      - uses: terraform-linters/setup-tflint@v4
      - run: tflint --recursive --config "$GITHUB_WORKSPACE/.tflint.hcl"
      - name: Policy-as-code (Checkov)
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform
          framework: terraform
          config_file: .checkov.yml

  container-scan:
    needs: [intake-api]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t intake-api:ci services/intake-api
      - name: Trivy (fail on fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: intake-api:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  terraform-plan:
    needs: terraform
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      id-token: write       # OIDC -> AWS, no static keys
      contents: read
      pull-requests: write  # post plan as PR comment
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: 1.9.8 }
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: us-east-1
      - name: Plan prod
        id: plan
        working-directory: terraform/envs/prod
        run: |
          terraform init -input=false
          terraform plan -input=false -no-color -lock=false -out=tfplan \
            -var-file=prod.tfvars | tee plan.txt
      - uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: tf-plan-prod
          path: terraform/envs/prod/plan.txt
