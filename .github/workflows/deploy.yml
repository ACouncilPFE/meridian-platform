# Production delivery: build once, sign, deploy the same digest everywhere.
# Dormant until the repo variable AWS_DEPLOY_ENABLED=true is set (Settings >
# Secrets and variables > Actions > Variables), so forks and portfolio
# copies without an AWS account don't fail on every push.
# Gated by the `production` GitHub environment (required reviewers), which is
# also the only OIDC subject the apply role trusts.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  build:
    if: vars.AWS_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      intake: ${{ steps.push.outputs.intake }}
      worker: ${{ steps.push.outputs.worker }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_BUILD_ROLE_ARN }}
          aws-region: us-east-1
      - uses: aws-actions/amazon-ecr-login@7290e214a610b32bc0eef81748948b6d466a8783 # v2.2.0
        id: ecr
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Build, push, sign, attach SBOM
        id: push
        run: |
          for svc in intake-api:services/intake-api pipeline-worker:workflows/pipeline-worker; do
            name="${svc%%:*}"; ctx="${svc#*:}"
            img="${{ steps.ecr.outputs.registry }}/$name:${{ github.sha }}"
            docker build --label org.opencontainers.image.revision=${{ github.sha }} -t "$img" "$ctx"
            docker push "$img"
            digest=$(docker inspect --format='{{index .RepoDigests 0}}' "$img")
            cosign sign --yes "$digest"
            key=$( [ "$name" = intake-api ] && echo intake || echo worker )
            echo "$key=$digest" >> "$GITHUB_OUTPUT"
          done

  deploy-prod:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with: { terraform_version: 1.9.8 }
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: us-east-1
      - name: Build DR lambda bundle
        run: make lambda-build
      - name: Run DB migrations (one-off Fargate task, expand-only)
        run: scripts/ci/run-migrations.sh prod "${{ needs.build.outputs.intake }}"
      - name: Terraform apply
        working-directory: terraform/envs/prod
        run: |
          terraform init -input=false
          terraform apply -auto-approve -input=false -var-file=prod.tfvars \
            -var intake_api_image="${{ needs.build.outputs.intake }}" \
            -var pipeline_worker_image="${{ needs.build.outputs.worker }}"
      - name: Wait for ECS steady state (circuit breaker rolls back on failure)
        run: aws ecs wait services-stable --cluster meridian-prod --services intake-api pipeline-worker
      - name: Post-deploy SLO gate
        # Abort (and alert) if the error budget burns fast in the 10 min after deploy.
        run: scripts/ci/slo_gate.sh --minutes 10 --max-burn-rate 14.4
