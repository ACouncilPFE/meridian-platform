# Local Alertmanager: same routing tree shape as AMP's, but delivers to a
# webhook sink you can inspect (http://localhost:9093 shows active alerts).
route:
  receiver: warning
  group_by: [alertname, service, env]
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 1h
  routes:
    - matchers: ['severity="critical"']
      receiver: critical

inhibit_rules:
  - source_matchers: ['severity="critical"']
    target_matchers: ['severity="warning"']
    equal: [alertname, service]

receivers:
  - name: critical
    webhook_configs:
      - url: http://alert-sink:8080/critical
  - name: warning
    webhook_configs:
      - url: http://alert-sink:8080/warning
