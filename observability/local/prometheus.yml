# Local Prometheus. Uses the exact same rule files as Amazon Managed
# Prometheus in AWS, so alerts are developed and tested locally first.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    env: local

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: intake-api
    static_configs:
      - targets: ["intake-api:8000"]
        labels: { service: intake-api, env: local }

  - job_name: pipeline-worker
    static_configs:
      - targets: ["pipeline-worker:9464"]
        labels: { service: pipeline-worker, env: local }

  - job_name: temporal
    static_configs:
      - targets: ["temporal:8000"]
        labels: { service: temporal, env: local }

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
        labels: { service: postgres, env: local }
