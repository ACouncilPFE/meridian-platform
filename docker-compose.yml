# Local development environment: `make up`
#
#   Intake API ........ http://localhost:8000/docs
#   Grafana ........... http://localhost:3000   (dashboards provisioned from repo)
#   Prometheus ........ http://localhost:9090
#   Alertmanager ...... http://localhost:9093
#   Temporal UI ....... http://localhost:8233
#
# Synthetic data only. Never point local tooling at a PHI-bearing database.

x-app-env: &app-env
  DEPLOY_ENV: local
  DATABASE_URL: postgresql+psycopg://app:app@postgres:5432/app
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
  LOG_LEVEL: INFO

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/local/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app"]
      interval: 5s
      retries: 10

  migrate:
    build: ./services/intake-api
    entrypoint: ["alembic", "upgrade", "head"]
    environment: *app-env
    depends_on:
      postgres: { condition: service_healthy }

  intake-api:
    build: ./services/intake-api
    environment:
      <<: *app-env
      OTEL_SERVICE_NAME: intake-api
    ports: ["8000:8000"]
    read_only: true
    tmpfs: [/tmp]
    depends_on:
      migrate: { condition: service_completed_successfully }

  temporal:
    image: temporalio/auto-setup:1.25.1
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: app
      POSTGRES_PWD: app
      POSTGRES_SEEDS: postgres
      PROMETHEUS_ENDPOINT: 0.0.0.0:8000
    ports: ["7233:7233"]
    depends_on:
      postgres: { condition: service_healthy }

  temporal-ui:
    image: temporalio/ui:2.31.2
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    ports: ["8233:8080"]
    depends_on: [temporal]

  pipeline-worker:
    build: ./workflows/pipeline-worker
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: default
      SOURCE_DSN: postgresql://app:app@postgres:5432/app
      EXPORT_BUCKET: local-exports
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
      PSEUDONYM_SECRET_B64: bG9jYWwtZGV2LXBzZXVkb255bS1zZWNyZXQtMDAwMDA=
    depends_on: [temporal, localstack]

  localstack:
    image: localstack/localstack:3.8
    environment:
      SERVICES: s3,kms,dynamodb
    ports: ["4566:4566"]

  # --- Observability: Prometheus + Grafana + Alertmanager + Tempo ---------
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    command: ["--config=/etc/otel/config.yaml"]
    volumes: ["./observability/local/otel-collector.yaml:/etc/otel/config.yaml:ro"]

  tempo:
    image: grafana/tempo:2.6.1
    command: ["-config.file=/etc/tempo.yaml"]
    volumes: ["./observability/local/tempo.yaml:/etc/tempo.yaml:ro"]

  prometheus:
    image: prom/prometheus:v2.54.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-remote-write-receiver
      - --enable-feature=exemplar-storage
    volumes:
      - ./observability/local/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/rules:/etc/prometheus/rules:ro
    ports: ["9090:9090"]

  alertmanager:
    image: prom/alertmanager:v0.27.0
    volumes: ["./observability/local/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro"]
    ports: ["9093:9093"]

  alert-sink:
    image: mendhak/http-https-echo:34
    environment: { HTTP_PORT: 8080 }

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.15.0
    environment:
      DATA_SOURCE_NAME: postgresql://app:app@postgres:5432/app?sslmode=disable
    depends_on: [postgres]

  grafana:
    image: grafana/grafana:11.2.2
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_FEATURE_TOGGLES_ENABLE: traceToMetrics
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    depends_on: [prometheus, tempo]

volumes:
  pgdata:
